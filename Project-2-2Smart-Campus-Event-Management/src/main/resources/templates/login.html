<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <h2>Login</h2>
  <form method="post" th:action="@{/login}">
    <label>Email</label>
    <input name="username" />
    <label>Password</label>
    <input type="password" name="password" />
    <button type="submit">Login</button>
  </form>
</body>
</html>
