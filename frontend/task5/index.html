<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Task 5 - Payment</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <h2>Task 5 - Payment Simulation</h2>
  <div class="card">
    <form id="payForm">
      <label>From Account</label>
      <select name="from_account_id" id="fromAccount"></select>
      <label>To Account</label>
      <select name="to_account_id" id="toAccount"></select>
      <label>Amount</label>
      <input name="amount" type="number" step="0.01" required />
      <button type="submit">Pay</button>
    </form>
    <div id="payMsg"></div>
  </div>
  <div class="card">
    <h3>Accounts</h3>
    <div id="accounts">Loading...</div>
  </div>
  <a href="../index.html">Back</a>
  <script src="../js/task5.js"></script>
</body>
</html>
